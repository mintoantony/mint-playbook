# Control bands for production metrics. Read by detect-bands.js (keep this shape: nested keys
# and plain values only). Rename or add metrics to match the keys in metrics.json.
baseline_days: 30     # baseline = hourly points in this many days before the recent window
min_baseline_points: 24  # fewer baseline points than this: the metric is skipped with a note
recent_points: 8      # the newest points that are tested against the baseline

metrics:
  error_rate:
    baseline: rolling_30d
    rules: western_electric
  p95_latency_ms:
    baseline: rolling_30d
    rules: western_electric

# Western Electric rules and the tier each fires:
#   1 point beyond 3 sigma                      -> 3sigma
#   2 of 3 points beyond 2 sigma, same side     -> 2sigma
#   4 of 5 points beyond 1 sigma, same side     -> 1sigma
#   8 points in a row on one side of the mean   -> 1sigma
tiers:
  1sigma:
    action: log
  2sigma:
    action: diagnose read-only with incident-analyst
  3sigma:
    action: propose a fix as a new playbook feature (intent.md) via PR or a pre-approved runbook
